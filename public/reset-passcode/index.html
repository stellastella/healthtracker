<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset - HealthTracker Pro</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(to bottom right, #f0f9ff, #ffffff, #f0fff4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      text-align: center;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
    .spinner {
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top: 4px solid #3b82f6;
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 24px;
      margin-bottom: 16px;
    }
    p {
      margin-bottom: 24px;
      line-height: 1.5;
    }
  </style>
  <script>
    // Redirect to the main app with the query parameters preserved
    window.onload = function() {
      const queryParams = window.location.search;
      const hash = window.location.hash;
      
      // Log for debugging
      console.log('Redirecting from reset-passcode page');
      console.log('Query params:', queryParams);
      console.log('Hash:', hash);
      
      // Redirect to the main app
      window.location.href = '/' + (queryParams ? queryParams : '') + (hash ? hash : '');
    };
  </script>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Password Reset</h1>
    <p>Redirecting you to the password reset page...</p>
    <p>If you are not redirected automatically, <a href="/" id="manual-redirect">click here</a>.</p>
  </div>
  <script>
    // Update the manual redirect link to include query params and hash
    document.getElementById('manual-redirect').href = '/' + (window.location.search || '') + (window.location.hash || '');
  </script>
</body>
</html>
