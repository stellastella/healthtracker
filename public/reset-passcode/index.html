<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset - HealthTracker Pro</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(to bottom right, #f0f9ff, #ffffff, #f0fff4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      text-align: center;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
    .spinner {
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top: 4px solid #3b82f6;
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 24px;
      margin-bottom: 16px;
    }
    p {
      margin-bottom: 24px;
      line-height: 1.5;
    }
    #debug {
      font-size: 12px;
      color: #666;
      margin-top: 20px;
      text-align: left;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Password Reset</h1>
    <p>Redirecting you to the password reset page...</p>
    <p>If you are not redirected automatically, <a href="/" id="manual-redirect">click here</a>.</p>
    <div id="debug"></div>
  </div>

  <script>
    // Function to log information for debugging
    function logDebug(message) {
      const debugElement = document.getElementById('debug');
      const logLine = document.createElement('div');
      logLine.textContent = message;
      debugElement.appendChild(logLine);
      console.log(message);
    }

    // Show debug info in development
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      document.getElementById('debug').style.display = 'block';
    }

    // Redirect to the main app with the query parameters preserved
    window.onload = function() {
      try {
        const queryParams = window.location.search;
        const hash = window.location.hash;
        
        // Log for debugging
        logDebug('Redirecting from reset-passcode page');
        logDebug('URL: ' + window.location.href);
        logDebug('Query params: ' + queryParams);
        logDebug('Hash: ' + hash);
        
        // Extract the code parameter if it exists
        const urlParams = new URLSearchParams(queryParams);
        const code = urlParams.get('code');
        
        if (code) {
          logDebug('Found code parameter: ' + code);
        }
        
        // Create the redirect URL
        let redirectUrl = '/';
        
        // Add query parameters if they exist
        if (queryParams) {
          redirectUrl += queryParams;
        }
        
        // Add hash if it exists
        if (hash) {
          redirectUrl += hash;
        }
        
        // Update the manual redirect link
        document.getElementById('manual-redirect').href = redirectUrl;
        
        logDebug('Redirecting to: ' + redirectUrl);
        
        // Redirect after a short delay to ensure logs are visible
        setTimeout(function() {
          window.location.href = redirectUrl;
        }, 1000);
      } catch (error) {
        logDebug('Error during redirect: ' + error.message);
        // Fallback to simple redirect
        window.location.href = '/';
      }
    };
  </script>
</body>
</html>
